<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Ограждение террасы из закалённого стекла и нержавеющей стали на фоне заката">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2632"/>
      <stop offset=".42" stop-color="#39424a"/>
      <stop offset=".68" stop-color="#8a6b55"/>
      <stop offset=".84" stop-color="#d9945e"/>
      <stop offset="1" stop-color="#e8b077"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffe1a6" stop-opacity=".85"/>
      <stop offset=".3" stop-color="#ffc97d" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffb25e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".46" r=".76">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a4c"/>
      <stop offset="1" stop-color="#2a3739"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253133"/>
      <stop offset="1" stop-color="#182224"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4b31"/>
      <stop offset=".35" stop-color="#4b3322"/>
      <stop offset="1" stop-color="#241811"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ece8" stop-opacity=".16"/>
      <stop offset=".45" stop-color="#aacdd0" stop-opacity=".05"/>
      <stop offset="1" stop-color="#d9ece8" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a3e3f"/>
      <stop offset=".3" stop-color="#c0c4c1"/>
      <stop offset=".5" stop-color="#787d7b"/>
      <stop offset=".72" stop-color="#e2e5e0"/>
      <stop offset="1" stop-color="#484c4c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d4829"/>
      <stop offset=".4" stop-color="#d4b171"/>
      <stop offset=".7" stop-color="#96753e"/>
      <stop offset="1" stop-color="#4f3e21"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46362b"/>
      <stop offset=".4" stop-color="#8a6a4d"/>
      <stop offset=".75" stop-color="#5a4434"/>
      <stop offset="1" stop-color="#33261e"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- солнце -->
  <circle cx="612" cy="238" r="30" fill="#ffe0a4" opacity=".9"/>
  <circle cx="612" cy="238" r="120" fill="url(#sunGlow)"/>

  <!-- облака -->
  <g fill="#e8c3a0" opacity=".13">
    <path d="M80 150c40-22 90-18 128 2 22-12 52-8 66 8-42 10-150 12-194-10z"/>
    <path d="M420 96c34-14 74-8 100 10 16-6 34 0 42 10-34 8-110 6-142-20z"/>
    <path d="M560 176c28-10 58-4 78 10-28 6-62 4-78-10z"/>
  </g>

  <!-- дальние холмы -->
  <path d="M0 332c70-40 150-52 228-28 62 19 126 20 190-4 78-30 166-24 232 20 48 33 102 46 150 36v-60H0z" fill="url(#hillFar)" opacity=".8"/>
  <path d="M0 360c96-44 200-48 286-12 72 30 156 32 238 2 88-32 182-24 276 26v224H0z" fill="url(#hillNear)"/>

  <!-- лес на горизонте -->
  <g fill="#1b2829">
    <path d="M0 362v-26l12 10 8-22 10 24 12-34 12 36 14-28 10 26 12-18 10 20 12-26 12 30 8-20 14 24 8-16 12 20 10-12 12 18 10-24 12 28 8-14 12 20 10-12 14 18v32z"/>
    <path d="M520 358v-22l12-4 8-28 12 30 10-20 12 26 14-32 10 30 12-18 10 22 12-26 12 30 8-16 14 22 10-12 12 20 10-18 12 22 10-14 14 18v24z"/>
  </g>

  <!-- лёгкая дымка -->
  <path d="M0 330h800v46H0z" fill="#f0c99c" opacity=".06"/>

  <!-- настил террасы -->
  <path d="M0 498h800v102H0z" fill="url(#deck)"/>
  <g stroke="#1c120c" stroke-opacity=".55" stroke-width="2">
    <path d="M0 510h800M0 526h800M0 546h800M0 570h800"/>
  </g>
  <g stroke="#c59564" stroke-opacity=".12" stroke-width="2">
    <path d="M0 504h800M0 518h800M0 536h800M0 560h800M0 584h800"/>
  </g>
  <path d="M0 498h800" stroke="#f0c184" stroke-opacity=".25"/>
  <g stroke="#000" stroke-opacity=".2">
    <path d="M100 502v98M200 502v98M300 502v98M400 502v98M500 502v98M600 502v98M700 502v98"/>
  </g>

  <!-- тени от ограждения -->
  <g stroke="#000" stroke-opacity=".22" stroke-width="16" filter="url(#soft)">
    <path d="M72 502v80M227 502v86M382 502v92M537 502v96M692 502v98"/>
  </g>

  <!-- стеклянные панели -->
  <g>
    <rect x="84" y="312" width="132" height="174" fill="url(#glass)"/>
    <rect x="239" y="312" width="132" height="174" fill="url(#glass)"/>
    <rect x="394" y="312" width="132" height="174" fill="url(#glass)"/>
    <rect x="549" y="312" width="132" height="174" fill="url(#glass)"/>
    <g stroke="#d8e8e4" stroke-opacity=".16" stroke-width="2">
      <path d="M100 468 196 326M116 476 208 338"/>
      <path d="M255 468 351 326M271 476 363 338"/>
      <path d="M410 468 506 326M426 476 518 338"/>
      <path d="M565 468 661 326M581 476 673 338"/>
    </g>
    <g stroke="#0b1011" stroke-opacity=".35">
      <rect x="84" y="312" width="132" height="174"/>
      <rect x="239" y="312" width="132" height="174"/>
      <rect x="394" y="312" width="132" height="174"/>
      <rect x="549" y="312" width="132" height="174"/>
    </g>
  </g>

  <!-- нижний профиль -->
  <rect x="42" y="486" width="716" height="14" fill="url(#steel)"/>
  <path d="M42 487h716" stroke="#eef0eb" stroke-opacity=".3"/>

  <!-- стойки -->
  <g fill="url(#steel)">
    <rect x="64" y="288" width="16" height="212" rx="2"/>
    <rect x="219" y="288" width="16" height="212" rx="2"/>
    <rect x="374" y="288" width="16" height="212" rx="2"/>
    <rect x="529" y="288" width="16" height="212" rx="2"/>
    <rect x="684" y="288" width="16" height="212" rx="2"/>
  </g>
  <g fill="url(#brass)">
    <rect x="59" y="282" width="26" height="7" rx="2"/>
    <rect x="214" y="282" width="26" height="7" rx="2"/>
    <rect x="369" y="282" width="26" height="7" rx="2"/>
    <rect x="524" y="282" width="26" height="7" rx="2"/>
    <rect x="679" y="282" width="26" height="7" rx="2"/>
  </g>

  <!-- зажимы стекла -->
  <g fill="url(#brass)">
    <rect x="76" y="322" width="14" height="5" rx="1"/>
    <rect x="210" y="322" width="14" height="5" rx="1"/>
    <rect x="231" y="322" width="14" height="5" rx="1"/>
    <rect x="365" y="322" width="14" height="5" rx="1"/>
    <rect x="386" y="322" width="14" height="5" rx="1"/>
    <rect x="520" y="322" width="14" height="5" rx="1"/>
    <rect x="541" y="322" width="14" height="5" rx="1"/>
    <rect x="675" y="322" width="14" height="5" rx="1"/>
  </g>

  <!-- верхний поручень -->
  <rect x="40" y="272" width="720" height="16" rx="8" fill="url(#steel)"/>
  <rect x="40" y="272" width="720" height="5" rx="2.5" fill="#f0f2ed" opacity=".28"/>
  <path d="M44 286h712" stroke="#000" stroke-opacity=".35" stroke-width="2"/>
  <rect x="70" y="266" width="140" height="4" rx="2" fill="url(#brass)" opacity=".65"/>
  <rect x="380" y="266" width="140" height="4" rx="2" fill="url(#brass)" opacity=".65"/>

  <!-- растение справа на переднем плане -->
  <g>
    <ellipse cx="714" cy="582" rx="62" ry="14" fill="#000" opacity=".5" filter="url(#blur)"/>
    <path d="M682 522h64l-8 58h-48z" fill="url(#pot)"/>
    <path d="M682 522h64v6h-64z" fill="#a07a56" opacity=".35"/>
    <path d="M714 520c-2-42 2-76 14-104M714 500c-18-8-28-26-30-48M716 476c16-10 24-26 24-44" fill="none" stroke="#6b7150" stroke-width="2.5" stroke-linecap="round"/>
    <g fill="#65704d">
      <ellipse cx="730" cy="410" rx="7" ry="17" transform="rotate(36 730 410)"/>
      <ellipse cx="682" cy="448" rx="7" ry="16" transform="rotate(-48 682 448)"/>
      <ellipse cx="741" cy="426" rx="5" ry="13" transform="rotate(62 741 426)"/>
      <ellipse cx="690" cy="472" rx="5" ry="12" transform="rotate(-34 690 472)"/>
      <ellipse cx="738" cy="462" rx="5" ry="12" transform="rotate(48 738 462)"/>
    </g>
    <path d="M714 520c-10-30-8-58 2-82" stroke="#596242" stroke-width="1.5" fill="none"/>
  </g>

  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
