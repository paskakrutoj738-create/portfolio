  <g fill="url(#metal)" stroke="#1c1e1f" stroke-width="1">
    <path d="M44 148h32l-6-12H50z"/>
    <path d="M372 148h30l-6-12h-18z"/>
    <path d="M724 148h32l-6-12h-20z"/>
  </g>

  <!-- вертикальные прутья -->
  <g fill="url(#metal)">
    <rect x="104" y="177" width="5" height="288" rx="2.5"/>
    <rect x="149" y="177" width="5" height="288" rx="2.5"/>
    <rect x="194" y="177" width="5" height="288" rx="2.5"/>
    <rect x="239" y="177" width="5" height="288" rx="2.5"/>
    <rect x="284" y="177" width="5" height="288" rx="2.5"/>
    <rect x="329" y="177" width="5" height="288" rx="2.5"/>
    <rect x="425" y="177" width="5" height="288" rx="2.5"/>
    <rect x="470" y="177" width="5" height="288" rx="2.5"/>
    <rect x="515" y="177" width="5" height="288" rx="2.5"/>
    <rect x="560" y="177" width="5" height="288" rx="2.5"/>
    <rect x="605" y="177" width="5" height="288" rx="2.5"/>
    <rect x="650" y="177" width="5" height="288" rx="2.5"/>
    <rect x="695" y="177" width="5" height="288" rx="2.5"/>
  </g>
  <g fill="url(#brass)">
    <rect x="101" y="258" width="11" height="6" rx="1.5"/>
    <rect x="146" y="258" width="11" height="6" rx="1.5"/>
    <rect x="191" y="258" width="11" height="6" rx="1.5"/>
    <rect x="236" y="258" width="11" height="6" rx="1.5"/>
    <rect x="281" y="258" width="11" height="6" rx="1.5"/>
    <rect x="326" y="258" width="11" height="6" rx="1.5"/>
    <rect x="422" y="258" width="11" height="6" rx="1.5"/>
    <rect x="467" y="258" width="11" height="6" rx="1.5"/>
    <rect x="512" y="258" width="11" height="6" rx="1.5"/>
    <rect x="557" y="258" width="11" height="6" rx="1.5"/>
    <rect x="602" y="258" width="11" height="6" rx="1.5"/>
    <rect x="647" y="258" width="11" height="6" rx="1.5"/>
    <rect x="692" y="258" width="11" height="6" rx="1.5"/>
  </g>

  <!-- кованые узоры -->
  <g transform="translate(218 348) scale(.92)"><use href="#scroll"/></g>
  <g transform="translate(561 348) scale(.92)"><use href="#scroll"/></g>

  <!-- блики -->
  <path d="M58 178h4v280h-4z" fill="#e9ebe6" opacity=".18"/>
  <path d="M386 178h3v280h-3z" fill="#e9ebe6" opacity=".14"/>
  <path d="M738 178h4v280h-4z" fill="#e9ebe6" opacity=".18"/>

  <!-- тень у пола -->
  <path d="M46 482h710v6H46z" fill="#000" opacity=".5"/>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
