  <g>
    <rect x="176" y="86" width="12" height="54" fill="#6d4930"/>
    <rect x="190" y="80" width="9" height="60" fill="#a28c6d"/>
    <rect x="201" y="90" width="14" height="50" fill="#42504a"/>
    <rect x="217" y="84" width="8" height="56" fill="#8b6a45"/>
    <rect x="227" y="94" width="12" height="46" fill="#5c4a3a"/>
    <path d="M304 140v-34c0-14 10-22 22-22s22 8 22 22v34z" fill="#4c514f"/>
    <path d="M312 118c0-12 6-18 14-18s14 6 14 18" fill="none" stroke="#b5b8b1" stroke-opacity=".2"/>
    <path d="M326 84V58M326 66c-13-4-19-13-19-25 12 2 19 12 19 25ZM326 72c12-5 17-14 16-26-11 4-17 14-16 26Z" fill="none" stroke="#6b714f" stroke-width="2"/>
    <path d="M320 54c8-4 14-4 20 0" stroke="#6b714f" stroke-width="1.5" fill="none"/>
    <rect x="502" y="110" width="64" height="31" rx="2" fill="#7b5a3a"/>
    <rect x="508" y="102" width="52" height="9" rx="2" fill="#9a7b56"/>
    <path d="M582 140v-28M582 124c-12-2-18-10-19-21 11 2 18 10 19 21ZM582 130c12-4 18-12 17-23-10 3-17 12-17 23Z" fill="none" stroke="#6d7550" stroke-width="2"/>
    <rect x="572" y="136" width="22" height="6" rx="2" fill="#b08a58"/>
  </g>

  <!-- вторая полка -->
  <g>
    <rect x="174" y="176" width="10" height="56" fill="#8a7355"/>
    <rect x="186" y="170" width="14" height="62" fill="#4c4034"/>
    <rect x="202" y="180" width="9" height="52" fill="#9a7f54"/>
    <rect x="213" y="174" width="13" height="58" fill="#67503b"/>
    <rect x="228" y="184" width="8" height="48" fill="#3f4a45"/>
    <rect x="238" y="178" width="11" height="54" fill="#8c6b47"/>
    <path d="M296 232v-44c0-9 8-15 18-15s18 6 18 15v44z" fill="#b3a58c"/>
    <path d="M302 212c0-14 5-22 12-22s12 8 12 22" fill="none" stroke="#6b5c47" stroke-opacity=".35"/>
    <path d="M292 232h44" stroke="#171a1b" stroke-opacity=".4"/>
    <rect x="388" y="190" width="54" height="42" rx="2" fill="#594331"/>
    <path d="M394 198h42M394 207h42M394 216h42" stroke="#b08a58" stroke-opacity=".25"/>
    <circle cx="474" cy="218" r="14" fill="#4e5250"/>
    <path d="M460 218h28" stroke="#a8aca6" stroke-opacity=".3"/>
    <rect x="520" y="196" width="11" height="36" fill="#7d6749"/>
    <rect x="533" y="190" width="9" height="42" fill="#4d5a52"/>
    <rect x="544" y="200" width="14" height="32" fill="#9a7a4d"/>
    <rect x="560" y="194" width="8" height="38" fill="#5b4735"/>
    <rect x="586" y="188" width="54" height="44" rx="3" fill="#6c5135"/>
    <circle cx="613" cy="210" r="4" fill="#c9a86a"/>
  </g>

