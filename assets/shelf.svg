<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Стеллаж-библиотека с металлическим каркасом и полками из ореха">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b2e"/>
      <stop offset=".56" stop-color="#161a1c"/>
      <stop offset="1" stop-color="#0a0c0d"/>
    </linearGradient>
    <radialGradient id="warm" cx=".18" cy=".2" r=".85">
      <stop offset="0" stop-color="#e8c182" stop-opacity=".32"/>
      <stop offset=".55" stop-color="#dcae68" stop-opacity=".06"/>
      <stop offset="1" stop-color="#dcae68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".78">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".64"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d6c3e"/>
      <stop offset=".3" stop-color="#7a502c"/>
      <stop offset=".72" stop-color="#5b3a20"/>
      <stop offset="1" stop-color="#402817"/>
    </linearGradient>
    <linearGradient id="woodFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c18f58"/>
      <stop offset=".3" stop-color="#966337"/>
      <stop offset=".7" stop-color="#734a28"/>
      <stop offset="1" stop-color="#54351c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#242728"/>
      <stop offset=".3" stop-color="#8b908d"/>
      <stop offset=".55" stop-color="#4a4e4d"/>
      <stop offset=".8" stop-color="#a7aba6"/>
      <stop offset="1" stop-color="#212425"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6a532c"/>
      <stop offset=".3" stop-color="#d5b477"/>
      <stop offset=".55" stop-color="#a07f47"/>
      <stop offset=".8" stop-color="#ecd6a4"/>
      <stop offset="1" stop-color="#594627"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5dcaa" stop-opacity=".26"/>
      <stop offset="1" stop-color="#e0bd82" stop-opacity=".05"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#warm)"/>

  <g stroke="#d9c39a" stroke-opacity=".05" stroke-width="1">
    <path d="M0 100h800M0 220h800M0 340h800M0 460h800"/>
    <path d="M100 0v540M220 0v540M340 0v540M460 0v540M580 0v540M700 0v540"/>
  </g>

  <!-- окно слева -->
  <g>
    <rect x="28" y="100" width="108" height="250" fill="url(#glass)" stroke="#181b1c" stroke-width="7"/>
    <rect x="28" y="100" width="108" height="250" fill="none" stroke="#b99a64" stroke-opacity=".32"/>
    <path d="M82 104v242M32 224h100" stroke="#131617" stroke-width="4"/>
    <ellipse cx="90" cy="230" rx="150" ry="160" fill="#f4d9a4" opacity=".06" filter="url(#blur)"/>
  </g>

  <g fill="none" stroke="#e3d0ac" stroke-opacity=".05">
    <rect x="170" y="52" width="600" height="440"/>
    <path d="M170 160h600M170 268h600M170 376h600M370 52v440M570 52v440"/>
  </g>

  <!-- пол -->
  <path d="M0 522h800v78H0z" fill="#080a0a"/>
  <path d="M0 522h800" stroke="#c2a36b" stroke-opacity=".22"/>
  <path d="M0 528h800" stroke="#000" stroke-opacity=".5"/>
  <ellipse cx="420" cy="532" rx="330" ry="26" fill="#000" opacity=".55" filter="url(#blur)"/>

  <!-- задняя тень -->
  <rect x="128" y="86" width="560" height="434" fill="#050606" opacity=".55"/>

  <!-- металлический каркас -->
  <g fill="url(#steel)">
    <rect x="130" y="80" width="14" height="442" rx="2"/>
    <rect x="666" y="80" width="14" height="442" rx="2"/>
    <rect x="398" y="80" width="9" height="442" rx="2"/>
    <rect x="130" y="80" width="550" height="10" rx="2"/>
    <rect x="130" y="512" width="550" height="10" rx="2"/>
  </g>
  <g fill="url(#brass)">
    <rect x="126" y="76" width="22" height="6" rx="2"/>
    <rect x="662" y="76" width="22" height="6" rx="2"/>
    <rect x="126" y="512" width="22" height="7" rx="2"/>
    <rect x="662" y="512" width="22" height="7" rx="2"/>
  </g>

