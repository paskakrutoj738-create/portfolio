  <g>
    <g>
      <rect x="142" y="142" width="526" height="15" rx="2" fill="url(#wood)"/>
      <rect x="142" y="142" width="526" height="5" rx="2" fill="url(#woodFace)"/>
      <path d="M146 146h518" stroke="#d8a66d" stroke-opacity=".3"/>
    </g>
    <g>
      <rect x="142" y="232" width="526" height="15" rx="2" fill="url(#wood)"/>
      <rect x="142" y="232" width="526" height="5" rx="2" fill="url(#woodFace)"/>
      <path d="M146 236h518" stroke="#d8a66d" stroke-opacity=".3"/>
    </g>
    <g>
      <rect x="142" y="322" width="526" height="15" rx="2" fill="url(#wood)"/>
      <rect x="142" y="322" width="526" height="5" rx="2" fill="url(#woodFace)"/>
      <path d="M146 326h518" stroke="#d8a66d" stroke-opacity=".3"/>
