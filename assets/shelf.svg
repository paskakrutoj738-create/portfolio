  <g>
    <rect x="170" y="266" width="84" height="56" fill="#2f3332" stroke="#8d7755" stroke-width="3"/>
    <rect x="178" y="274" width="68" height="40" fill="#656c62"/>
    <path d="M186 302c10-18 26-24 48-20v16h-48z" fill="#7d8068" opacity=".7"/>
    <rect x="270" y="278" width="11" height="44" fill="#5d4935"/>
    <rect x="283" y="272" width="14" height="50" fill="#8d6b43"/>
    <rect x="299" y="280" width="8" height="42" fill="#43504a"/>
    <rect x="309" y="276" width="12" height="46" fill="#a18c6d"/>
    <path d="M344 322v-40h44v40z" fill="#4e3b2a"/>
    <path d="M352 282v40M380 282v40" stroke="#2d241b" stroke-opacity=".6"/>
    <rect x="430" y="284" width="68" height="38" rx="2" fill="#7e6142"/>
    <rect x="438" y="276" width="52" height="9" rx="2" fill="#a48560"/>
    <path d="M552 322v-42c0-8 7-14 16-14s16 6 16 14v42z" fill="#3d4342"/>
    <path d="M558 294c0-12 4-18 10-18s10 6 10 18" fill="none" stroke="#9da19b" stroke-opacity=".25"/>
    <rect x="608" y="280" width="34" height="42" rx="2" fill="#5c4631"/>
    <path d="M614 288h22M614 298h22M614 308h22" stroke="#b08a58" stroke-opacity=".22"/>
  </g>

  <!-- четвёртая полка: большие книги, скульптура, корзина -->
  <g>
    <rect x="172" y="356" width="13" height="56" fill="#8a6d49"/>
    <rect x="187" y="350" width="10" height="62" fill="#4e5c55"/>
    <rect x="199" y="360" width="16" height="52" fill="#6b4d35"/>
    <rect x="217" y="354" width="11" height="58" fill="#9b825d"/>
    <rect x="230" y="362" width="8" height="50" fill="#3f4a44"/>
    <rect x="240" y="358" width="14" height="54" fill="#7e5c3c"/>
    <path d="M300 412v-34c8-8 18-12 28-8 12 4 18 16 16 42z" fill="#59605b"/>
    <path d="M308 400c13-14 24-16 32-10" fill="none" stroke="#9ca09a" stroke-opacity=".3"/>
    <rect x="364" y="374" width="50" height="38" rx="2" fill="#60452f"/>
    <path d="M372 382h34M372 392h34M372 402h34" stroke="#b08a58" stroke-opacity=".2"/>
    <path d="M466 412v-38l-10-8h76l-10 8v38z" fill="#8b724d"/>
    <path d="M470 368h52M474 412v-38M514 412v-38M480 392h32" stroke="#5c4a32" stroke-opacity=".55"/>
    <rect x="552" y="366" width="76" height="46" rx="2" fill="#4d3b2b"/>
    <path d="M560 376h60M560 388h60M560 400h60" stroke="#9d7a51" stroke-opacity=".25"/>
  </g>

  <!-- нижняя полка: корзины -->
  <g>
    <path d="M178 451h90v34c0 7-6 12-13 12h-64c-7 0-13-5-13-12z" fill="#78603f"/>
    <path d="M184 462h78M182 474h82" stroke="#3f3223" stroke-opacity=".55" stroke-width="3"/>
    <path d="M242 451c0-10 8-18 18-18" fill="none" stroke="#3f3223" stroke-width="2"/>
    <rect x="318" y="455" width="60" height="42" rx="2" fill="#5b4632"/>
    <rect x="326" y="463" width="44" height="26" fill="#413225"/>
    <rect x="330" y="469" width="36" height="2" fill="#a6855b" opacity=".4"/>
    <path d="M474 497v-37h74v37z" fill="#8a6d47"/>
    <path d="M482 467h58M482 479h58M482 491h58" stroke="#4b3927" stroke-opacity=".5"/>
    <path d="M576 497v-33h56v33z" fill="#3e3328"/>
    <path d="M584 473h40M584 485h40" stroke="#8a704f" stroke-opacity=".35"/>
  </g>

  <!-- блики -->
  <path d="M137 88h3v428h-3z" fill="#fff" opacity=".18"/>
  <path d="M672 88h3v428h-3z" fill="#fff" opacity=".12"/>
  <path d="M404 88h1.5v428H404z" fill="#fff" opacity=".13"/>
  <rect width="800" height="600" fill="url(#vig)"/>
