<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Кованые ворота с калиткой между кирпичными столбами в сумерках">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d262d"/>
      <stop offset=".52" stop-color="#2b3134"/>
      <stop offset=".78" stop-color="#3a352c"/>
      <stop offset="1" stop-color="#17140f"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy=".78" r=".65">
      <stop offset="0" stop-color="#e0a660" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#c58a48" stop-opacity=".07"/>
      <stop offset="1" stop-color="#c58a48" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd08a" stop-opacity=".75"/>
      <stop offset=".42" stop-color="#ffc774" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffc774" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".75">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".62"/>
    </radialGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3e2a22"/>
      <stop offset=".28" stop-color="#76503e"/>
      <stop offset=".56" stop-color="#5a3b2e"/>
      <stop offset=".8" stop-color="#875c45"/>
      <stop offset="1" stop-color="#35241d"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a907d"/>
      <stop offset=".45" stop-color="#6e6657"/>
      <stop offset="1" stop-color="#3f3a31"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#171a1b"/>
      <stop offset=".28" stop-color="#585c5a"/>
      <stop offset=".52" stop-color="#2a2d2e"/>
      <stop offset=".76" stop-color="#6b6f6c"/>
      <stop offset="1" stop-color="#141718"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e4a2a"/>
      <stop offset=".3" stop-color="#d0ae70"/>
      <stop offset=".55" stop-color="#96763f"/>
      <stop offset=".8" stop-color="#e5cd98"/>
      <stop offset="1" stop-color="#514024"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242220"/>
      <stop offset=".4" stop-color="#161513"/>
      <stop offset="1" stop-color="#0a0a09"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#horizon)"/>

  <!-- дальний забор и деревья -->
  <g opacity=".5">
    <path d="M0 330h800v80H0z" fill="#121515"/>
    <path d="M0 330h800" stroke="#746b55" stroke-opacity=".18"/>
    <g fill="#0e1212">
      <path d="M60 330c0-70 28-120 70-120s68 50 68 120z"/>
      <path d="M660 330c0-80 32-132 78-132s76 52 76 132z"/>
      <path d="M740 330c0-54 20-88 50-88s48 34 48 88z"/>
    </g>
  </g>

  <g stroke="#d9c39a" stroke-opacity=".035" stroke-width="1">
    <path d="M0 100h800M0 200h800M0 300h800M0 400h800M0 500h800"/>
  </g>

  <!-- земля -->
  <path d="M0 510h800v90H0z" fill="url(#ground)"/>
  <path d="M0 510h800" stroke="#8c7757" stroke-opacity=".2"/>
  <path d="M0 520h800" stroke="#000" stroke-opacity=".5"/>

  <!-- тени -->
  <ellipse cx="110" cy="526" rx="120" ry="20" fill="#000" opacity=".7" filter="url(#blur)"/>
  <ellipse cx="690" cy="526" rx="120" ry="20" fill="#000" opacity=".7" filter="url(#blur)"/>
  <ellipse cx="400" cy="520" rx="280" ry="26" fill="#000" opacity=".55" filter="url(#blur)"/>

  <!-- кирпичные столбы -->
  <g>
    <rect x="54" y="172" width="108" height="340" fill="url(#brick)"/>
    <rect x="638" y="172" width="108" height="340" fill="url(#brick)"/>
    <g stroke="#2a1c16" stroke-opacity=".55" stroke-width="2">
      <path d="M54 200h108M54 228h108M54 256h108M54 284h108M54 312h108M54 340h108M54 368h108M54 396h108M54 424h108M54 452h108M54 480h108M54 508h108"/>
      <path d="M638 200h108M638 228h108M638 256h108M638 284h108M638 312h108M638 340h108M638 368h108M638 396h108M638 424h108M638 452h108M638 480h108M638 508h108"/>
    </g>
    <g stroke="#c08a6c" stroke-opacity=".14" stroke-width="2">
      <path d="M108 172v28M82 200v28M136 200v28M108 228v28M82 256v28M136 256v28M108 284v28M82 312v28M136 312v28M108 340v28M82 368v28M136 368v28M108 396v28M82 424v28M136 424v28M108 452v28M82 480v28M136 480v28M108 508v4"/>
      <path d="M692 172v28M666 200v28M720 200v28M692 228v28M666 256v28M720 256v28M692 284v28M666 312v28M720 312v28M692 340v28M666 368v28M720 368v28M692 396v28M666 424v28M720 424v28M692 452v28M666 480v28M720 480v28M692 508v4"/>
    </g>
    <g fill="url(#stone)">
      <path d="M36 146h144v16H36z"/>
      <path d="M44 162h128v14H44z"/>
      <path d="M60 176h96v6H60z"/>
      <path d="M620 146h144v16H620z"/>
      <path d="M628 162h128v14H628z"/>
      <path d="M644 176h96v6H644z"/>
    </g>
    <g fill="none" stroke="#c9bda1" stroke-opacity=".18">
      <path d="M40 150h136M48 166h120M64 180h88"/>
      <path d="M624 150h136M632 166h120M648 180h88"/>
    </g>
    <g fill="#8d7a5c" opacity=".5">
      <circle cx="80" cy="220" r="2"/>
      <circle cx="142" cy="304" r="2"/>
      <circle cx="92" cy="440" r="1.5"/>
      <circle cx="664" cy="240" r="2"/>
      <circle cx="722" cy="356" r="1.5"/>
      <circle cx="704" cy="470" r="2"/>
    </g>
  </g>

  <!-- тёплый свет фонаря -->
  <circle cx="123" cy="112" r="135" fill="url(#lanternGlow)" opacity=".55"/>
  <ellipse cx="130" cy="516" rx="120" ry="28" fill="#e6b56c" opacity=".08" filter="url(#blur)"/>

  <!-- фонарь на левом столбе -->
  <g>
    <path d="M96 146h54v8H96z" fill="#2c2f2f"/>
    <path d="M104 132h38l8 14h-54z" fill="#202323" stroke="#0f1111" stroke-width="1"/>
    <path d="M112 132v-10h22v10" fill="none" stroke="#202323" stroke-width="4"/>
    <path d="M112 132h22l4 14h-30z" fill="#ffcf85" opacity=".65"/>
    <rect x="106" y="144" width="34" height="6" rx="2" fill="#1a1d1d"/>
    <path d="M111 120h24" stroke="#c9a86a" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M123 112v-15" stroke="#1a1d1d" stroke-width="3"/>
    <circle cx="123" cy="94" r="4" fill="#1a1d1d"/>
  </g>

  <!-- ворота -->
  <g>
    <!-- верхняя перекладина -->
    <path d="M166 200h468v12H166z" fill="url(#iron)"/>
    <path d="M166 480h468v12H166z" fill="url(#iron)"/>
    <path d="M166 200h468" stroke="#b9bcb5" stroke-opacity=".22"/>
    <path d="M166 480h468" stroke="#b9bcb5" stroke-opacity=".15"/>

    <!-- стойки створок -->
    <g fill="url(#iron)">
      <rect x="166" y="200" width="11" height="292"/>
      <rect x="395" y="200" width="10" height="292"/>
      <rect x="401" y="200" width="10" height="292"/>
      <rect x="623" y="200" width="11" height="292"/>
    </g>

    <!-- прутья -->
    <g fill="url(#iron)">
      <rect x="194" y="208" width="5" height="276" rx="1"/>
      <rect x="232" y="208" width="5" height="276" rx="1"/>
      <rect x="270" y="208" width="5" height="276" rx="1"/>
      <rect x="308" y="208" width="5" height="276" rx="1"/>
      <rect x="346" y="208" width="5" height="276" rx="1"/>
      <rect x="453" y="208" width="5" height="276" rx="1"/>
      <rect x="491" y="208" width="5" height="276" rx="1"/>
      <rect x="529" y="208" width="5" height="276" rx="1"/>
      <rect x="567" y="208" width="5" height="276" rx="1"/>
      <rect x="605" y="208" width="5" height="276" rx="1"/>
    </g>

    <!-- наконечники -->
    <g fill="url(#brass)">
      <path d="M192 200h9l-4.5-14z"/>
      <path d="M230 200h9l-4.5-14z"/>
      <path d="M268 200h9l-4.5-14z"/>
      <path d="M306 200h9l-4.5-14z"/>
      <path d="M344 200h9l-4.5-14z"/>
      <path d="M451 200h9l-4.5-14z"/>
      <path d="M489 200h9l-4.5-14z"/>
      <path d="M527 200h9l-4.5-14z"/>
      <path d="M565 200h9l-4.5-14z"/>
      <path d="M603 200h9l-4.5-14z"/>
    </g>

    <!-- верхний декоративный пояс -->
    <g fill="none" stroke="url(#brass)" stroke-width="2.6" stroke-linecap="round">
      <path d="M200 254c12-26 32-26 44 0"/>
      <path d="M246 254c12 26 32 26 44 0"/>
      <path d="M292 254c12-26 32-26 44 0"/>
      <path d="M338 254c12 26 30 26 42 0"/>
      <path d="M462 254c12-26 30-26 42 0"/>
      <path d="M508 254c12 26 32 26 44 0"/>
      <path d="M554 254c12-26 32-26 44 0"/>
      <path d="M600 254c12 26 30 26 42 0"/>
    </g>
    <g fill="url(#brass)">
      <circle cx="222" cy="236" r="2.6"/>
      <circle cx="490" cy="236" r="2.6"/>
      <circle cx="578" cy="236" r="2.6"/>
    </g>

    <!-- нижние завитки -->
    <g fill="none" stroke="url(#brass)" stroke-width="2.2" stroke-linecap="round" opacity=".85">
      <path d="M196 438c14 0 24 10 24 24 0 10-8 18-18 18-8 0-14-6-14-14 0-6 5-11 11-11"/>
      <path d="M358 438c-14 0-24 10-24 24 0 10 8 18 18 18 8 0 14-6 14-14 0-6-5-11-11-11"/>
      <path d="M455 438c14 0 24 10 24 24 0 10-8 18-18 18-8 0-14-6-14-14 0-6 5-11 11-11"/>
      <path d="M617 438c-14 0-24 10-24 24 0 10 8 18 18 18 8 0 14-6 14-14 0-6-5-11-11-11"/>
    </g>

    <!-- центральный медальон -->
    <g transform="translate(400 340)">
      <circle r="45" fill="none" stroke="url(#iron)" stroke-width="10"/>
      <circle r="45" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
      <circle r="34" fill="none" stroke="url(#brass)" stroke-width="1.6" opacity=".7"/>
      <path d="M-22 10c0-20 16-34 36-34M22-10c0 20-16 34-36 34" fill="none" stroke="url(#brass)" stroke-width="2.4" stroke-linecap="round"/>
      <circle r="5" fill="url(#brass)"/>
      <path d="M0-56v11M0 45v11M-56 0h11M45 0h11" stroke="url(#brass)" stroke-width="2.5"/>
    </g>

    <!-- ручки -->
    <g fill="url(#brass)">
      <circle cx="384" cy="384" r="5"/>
      <circle cx="416" cy="384" r="5"/>
      <path d="M384 389v18c0 5 4 8 9 8M416 389v18c0 5-4 8-9 8" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
    </g>

    <!-- блики -->
    <path d="M170 210h2v272h-2z" fill="#fff" opacity=".16"/>
    <path d="M627 210h2v272h-2z" fill="#fff" opacity=".12"/>
    <path d="M196 214h1v264h-1z" fill="#fff" opacity=".1"/>
    <path d="M455 214h1v264h-1z" fill="#fff" opacity=".1"/>
  </g>

  <!-- гравий -->
  <g fill="#9a8b73" opacity=".25">
    <circle cx="196" cy="548" r="1.5"/>
    <circle cx="238" cy="570" r="1"/>
    <circle cx="302" cy="552" r="1.2"/>
    <circle cx="360" cy="578" r="1.5"/>
    <circle cx="430" cy="548" r="1"/>
    <circle cx="494" cy="566" r="1.4"/>
    <circle cx="560" cy="548" r="1.2"/>
    <circle cx="620" cy="574" r="1"/>
    <circle cx="276" cy="540" r="1"/>
    <circle cx="520" cy="540" r="1.2"/>
  </g>

  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
