      <circle cx="270" cy="208" r="1.5"/><circle cx="294" cy="208" r="1.5"/><circle cx="318" cy="208" r="1.5"/><circle cx="342" cy="208" r="1.5"/><circle cx="366" cy="208" r="1.5"/><circle cx="390" cy="208" r="1.5"/><circle cx="414" cy="208" r="1.5"/><circle cx="438" cy="208" r="1.5"/><circle cx="462" cy="208" r="1.5"/><circle cx="486" cy="208" r="1.5"/><circle cx="510" cy="208" r="1.5"/><circle cx="534" cy="208" r="1.5"/>
