      <circle cx="270" cy="256" r="1.5"/><circle cx="294" cy="256" r="1.5"/><circle cx="318" cy="256" r="1.5"/><circle cx="342" cy="256" r="1.5"/><circle cx="366" cy="256" r="1.5"/><circle cx="390" cy="256" r="1.5"/><circle cx="414" cy="256" r="1.5"/><circle cx="438" cy="256" r="1.5"/><circle cx="462" cy="256" r="1.5"/><circle cx="486" cy="256" r="1.5"/><circle cx="510" cy="256" r="1.5"/><circle cx="534" cy="256" r="1.5"/>
