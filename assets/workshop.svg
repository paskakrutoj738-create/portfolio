<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-label="Мастерская: верстак, наковальня, инструменты и заготовки из металла и дерева">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b2d"/>
      <stop offset=".5" stop-color="#171b1d"/>
      <stop offset="1" stop-color="#0a0c0d"/>
    </linearGradient>
    <radialGradient id="warm" cx=".2" cy=".18" r=".9">
      <stop offset="0" stop-color="#eac17d" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#dcae68" stop-opacity=".06"/>
      <stop offset="1" stop-color="#dcae68" stop-opacity="0"/>
