      <rect x="176" y="478" width="16" height="22" rx="3"/>
      <rect x="614" y="478" width="16" height="22" rx="3"/>
    </g>
    <path d="M176 486h16M614 486h16" stroke="#f0d8a4" stroke-opacity=".4"/>

    <!-- подсветка под стойкой -->
    <rect x="180" y="528" width="446" height="3" fill="#ffcf8a" opacity=".3"/>
    <ellipse cx="400" cy="542" rx="250" ry="16" fill="#e8b46c" opacity=".09" filter="url(#blur)"/>

    <!-- декор на стойке -->
    <g>
      <path d="M282 336v-24c0-9 7-16 16-16s16 7 16 16v24z" fill="#6d6f64"/>
      <path d="M298 296v-34M298 272c-11-4-16-13-15-24 10 3 15 12 15 24ZM298 282c10-4 15-13 14-23-9 3-14 12-14 23Z" fill="none" stroke="#777b58" stroke-width="2"/>
      <rect x="470" y="308" width="10" height="28" rx="2" fill="#c9c4b0" opacity=".6"/>
      <rect x="486" y="314" width="10" height="22" rx="2" fill="#a9a48e" opacity=".55"/>
      <path d="M516 316h10v20h-10z" fill="#8a6d47"/>
      <path d="M520 316v-12" stroke="#8a6d47" stroke-width="2"/>
    </g>
  </g>

  <!-- барные стулья -->
  <g>
    <g>
      <path d="M286 458h76l-6 16h-64z" fill="url(#wood)"/>
      <path d="M286 452h76v12h-76z" fill="url(#woodTop)"/>
      <path d="M292 456h64" stroke="#dda86e" stroke-opacity=".35"/>
      <g stroke="url(#steel)" stroke-width="6" stroke-linecap="round">
        <path d="M296 466 280 552M352 466l16 86M306 468l4 84M342 468l-4 84"/>
      </g>
      <path d="M286 512c18-10 58-10 76 0" fill="none" stroke="url(#brass)" stroke-width="3"/>
    </g>
    <g>
      <path d="M512 458h76l-6 16h-64z" fill="url(#wood)"/>
      <path d="M512 452h76v12h-76z" fill="url(#woodTop)"/>
      <path d="M518 456h64" stroke="#dda86e" stroke-opacity=".35"/>
      <g stroke="url(#steel)" stroke-width="6" stroke-linecap="round">
        <path d="M522 466 506 552M578 466l16 86M532 468l4 84M568 468l-4 84"/>
      </g>
      <path d="M512 512c18-10 58-10 76 0" fill="none" stroke="url(#brass)" stroke-width="3"/>
