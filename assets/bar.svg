      <rect x="130" y="92" width="6" height="16" fill="#3f5149"/>
      <path d="M174 112v38h-16v-38c0-8 3-10 3-18h10c0 8 3 10 3 18z" fill="#6b5236"/>
      <rect x="169" y="88" width="5" height="14" fill="#6b5236"/>
      <path d="M222 120v30h-26v-30c0-10 7-14 13-14s13 4 13 14z" fill="#a8a18d"/>
      <path d="M210 106v-12" stroke="#a8a18d" stroke-width="3"/>
      <path d="M274 124v26h-34v-26z" fill="#54463a"/>
      <path d="M282 106c0-10 8-18 18-18s18 8 18 18v44h-36z" fill="#5b5f5b"/>
      <circle cx="300" cy="96" r="6" fill="#5b5f5b"/>
      <path d="M350 110h12v40h-12z" fill="#7e5f3d"/>
      <path d="M352 110c0-10 2-14 4-18 2 4 4 8 4 18z" fill="#7e5f3d"/>
      <path d="M404 118c0-8 7-15 15-15s15 7 15 15v32h-30z" fill="#8e8e7a"/>
      <rect x="462" y="108" width="10" height="42" fill="#4d4a3b"/>
      <rect x="478" y="116" width="8" height="34" fill="#6e583d"/>
      <rect x="492" y="112" width="12" height="38" fill="#49564f"/>
      <path d="M554 150v-34c0-9 7-16 16-16s16 7 16 16v34z" fill="#5d5342"/>
      <path d="M562 132c0-11 3-17 8-17s8 6 8 17" fill="none" stroke="#a39378" stroke-opacity=".28"/>
      <path d="M626 150v-38h30v38z" fill="#4b3b2d"/>
      <path d="M634 112v-10M648 112v-10" stroke="#8d795b" stroke-width="3"/>
    </g>

    <!-- нижняя полка: банки и книги -->
    <g>
      <rect x="126" y="198" width="16" height="44" rx="2" fill="#6b5035"/>
      <rect x="146" y="206" width="12" height="36" rx="2" fill="#4c5a50"/>
      <rect x="162" y="194" width="14" height="48" rx="2" fill="#8b6f4b"/>
      <rect x="198" y="210" width="36" height="32" rx="3" fill="#5f5f54"/>
      <path d="M206 218h20M206 226h20M206 234h20" stroke="#9f9a82" stroke-opacity=".22"/>
      <rect x="262" y="200" width="46" height="42" rx="3" fill="#54422f"/>
      <path d="M270 210h30M270 220h30M270 230h30" stroke="#a8865b" stroke-opacity=".25"/>
      <path d="M336 242v-34c0-7 5-12 12-12s12 5 12 12v34z" fill="#8b8776"/>
      <path d="M348 196v-8" stroke="#8b8776" stroke-width="2"/>
