    <path d="M100 0v520M200 0v520M300 0v520M400 0v520M500 0v520M600 0v520M700 0v520"/>
  </g>

  <!-- фартук -->
  <rect x="40" y="300" width="720" height="62" fill="#161a1b"/>
  <g stroke="#b9a479" stroke-opacity=".09">
    <path d="M40 322h720M40 344h720"/>
    <path d="M120 300v62M200 300v62M280 300v62M360 300v62M440 300v62M520 300v62M600 300v62M680 300v62"/>
  </g>

  <!-- полки с посудой -->
  <g>
    <rect x="86" y="150" width="628" height="11" rx="2" fill="url(#wood)"/>
    <rect x="86" y="150" width="628" height="4" rx="2" fill="#c08c58" opacity=".5"/>
    <rect x="86" y="242" width="628" height="11" rx="2" fill="url(#wood)"/>
