    <rect x="164" y="524" width="478" height="8" fill="url(#brass)"/>
    <rect x="164" y="384" width="7" height="148" fill="url(#brass)"/>
    <rect x="635" y="384" width="7" height="148" fill="url(#brass)"/>
    <g fill="url(#brass)">
