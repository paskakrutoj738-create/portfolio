<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Барная стойка из дуба с латунным каркасом и барными стульями">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252a2c"/>
      <stop offset=".55" stop-color="#171b1d"/>
      <stop offset="1" stop-color="#0b0c0d"/>
    </linearGradient>
    <radialGradient id="warm" cx=".5" cy=".1" r=".8">
      <stop offset="0" stop-color="#eac17d" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#dcae68" stop-opacity=".05"/>
      <stop offset="1" stop-color="#dcae68" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".46" r=".76">
      <stop offset=".42" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".64"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54371d"/>
      <stop offset=".18" stop-color="#96623a"/>
      <stop offset=".42" stop-color="#7a4e2b"/>
      <stop offset=".68" stop-color="#a87245"/>
      <stop offset=".86" stop-color="#6a4324"/>
      <stop offset="1" stop-color="#452c17"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d09b62"/>
      <stop offset=".28" stop-color="#a97042"/>
      <stop offset=".75" stop-color="#7b4d29"/>
      <stop offset="1" stop-color="#56351b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e4928"/>
      <stop offset=".26" stop-color="#d9b878"/>
      <stop offset=".5" stop-color="#9e7c43"/>
      <stop offset=".74" stop-color="#efd7a2"/>
      <stop offset="1" stop-color="#514022"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a1d1d"/>
      <stop offset=".3" stop-color="#4f5351"/>
      <stop offset=".55" stop-color="#232626"/>
      <stop offset=".8" stop-color="#5d615d"/>
      <stop offset="1" stop-color="#141717"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d3a"/>
      <stop offset="1" stop-color="#1b1d1c"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
