    <path d="M298 128h64l-16 44h-32z" fill="url(#brass)" stroke="#171a1a" stroke-width="2"/>
    <path d="M498 110h64l-16 42h-32z" fill="url(#brass)" stroke="#171a1a" stroke-width="2"/>
    <path d="M306 133h48M506 115h48" stroke="#f0d9a9" stroke-opacity=".45"/>
    <circle cx="330" cy="180" r="7" fill="#ffd79a"/>
    <circle cx="530" cy="160" r="6" fill="#ffd79a"/>
    <circle cx="330" cy="184" r="60" fill="url(#lampGlow)"/>
    <circle cx="530" cy="166" r="52" fill="url(#lampGlow)" opacity=".75"/>
  </g>

  <!-- пол -->
  <path d="M0 520h800v80H0z" fill="#0a0b0b"/>
  <path d="M0 520h800" stroke="#c2a36b" stroke-opacity=".18"/>
  <ellipse cx="400" cy="538" rx="300" ry="24" fill="#000" opacity=".55" filter="url(#blur)"/>

