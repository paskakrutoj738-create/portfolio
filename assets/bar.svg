    <path d="M142 370h520v17H142z" fill="url(#wood)"/>
    <path d="M142 370h520" stroke="#e0aa70" stroke-opacity=".45" stroke-width="2"/>
    <path d="M142 387h520" stroke="#1d1209" stroke-opacity=".6"/>
    <path d="M192 342h410" stroke="#ecc088" stroke-opacity=".28" stroke-width="2"/>
