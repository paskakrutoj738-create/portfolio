    <g stroke="#371f0e" stroke-opacity=".5" stroke-width="2">
      <path d="M192 390v136M214 390v136M236 390v136M258 390v136M280 390v136M302 390v136M324 390v136M346 390v136M368 390v136M390 390v136M412 390v136M434 390v136M456 390v136M478 390v136M500 390v136M522 390v136M544 390v136M566 390v136M588 390v136M610 390v136"/>
    </g>
    <g stroke="#d9a267" stroke-opacity=".13" stroke-width="1">
      <path d="M190 392v132M212 392v132M234 392v132M256 392v132M278 392v132M300 392v132M322 392v132M344 392v132M366 392v132M388 392v132M410 392v132M432 392v132M454 392v132M476 392v132M498 392v132M520 392v132M542 392v132M564 392v132M586 392v132M608 392v132"/>
    </g>

