  <!-- блики -->
  <path d="M180 394h2v126h-2z" fill="#fff" opacity=".08"/>
  <path d="M626 394h2v126h-2z" fill="#fff" opacity=".06"/>
  <rect width="800" height="600" fill="url(#vig)"/>
</svg>
